- case: Push notification payloads expose sensitive information
  summary: The payload field of push notifications is often not encrypted, which leads to overexposure
    of the potentially sensitive data within it.
  detail: While most push notification service providers such as Apple Push Notification Service (APNs),
    or Firebase Cloud Messaging (FCM) strongly recommend the encryption of the payload of push notifications
    to mobile phones, this is quite often neglected. When this payload is not encrypted, sensitive data
    such as the contents of personal messages can be exposed to the providers of such services. Often,
    the owner of the mobile device is not aware that the contents of their notifications may be overly
    exposed.
  refs:
  - https://blog.phnx.im/privacy-of-push-notifications/
  categories:
  - DD
  - Nc
  - U
  characteristics:
  - indicator: Data excessively available to push notification providers
    rationale: The unencrypted payloads of push notifications cause the information within to be overly
      accessible (i.e., to the providers of push notification services).
    category: DD
    node_id: DD.involved_parties_and_exposure.availability_accessibility_of_data
    node_path: Involved parties and exposure > Availability/accessibility of data
  - indicator: User is unaware of overexposure of their data
    rationale: The user is often not aware that the push notification service provider has access to the
      unencrypted payload data.
    category: U
    node_id: U.unawareness_of_processing.unawareness_as_data_subject
    node_path: Unawareness of processing > Unawareness as data subject
  - indicator: Lacking Encryption indicates insufficient cybersecurity risk management
    rationale: The lack of encryption of notification payloads is an indication that the system was not
      designed according to cyber security standards and best practices.
    category: Nc
    node_id: Nc.insufficient_cybersecurity_risk_management
    node_path: Insufficient cybersecurity risk management
